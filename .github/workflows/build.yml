name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: git-agent-linux-installer
            asset-path: dist/GitAgent_*.deb
          - name: macOS
            os: macos-latest
            artifact: git-agent-macos-installer
            asset-path: dist/GitAgent-*-macOS.dmg
          - name: Windows
            os: windows-latest
            artifact: git-agent-windows-installer
            asset-path: dist/GitAgentSetup-*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object { $_.name -eq "git-agent" }).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          if ($packageVersion -ne $tagVersion) {
            throw "Release tag ${{ github.ref_name }} does not match Cargo package version $packageVersion"
          }

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Normalize Git line endings
        if: runner.os != 'Windows'
        shell: bash
        run: git config --global core.autocrlf false && git config --global core.safecrlf false

      - name: Normalize Git line endings
        if: runner.os == 'Windows'
        shell: cmd
        run: git config --global core.autocrlf false && git config --global core.safecrlf false

      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test --locked

      - name: Test
        if: runner.os == 'Windows'
        shell: cmd
        run: cargo test --locked

      - name: Build release binaries
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release --locked

      - name: Build universal macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist/universal-bin
          for executable in git-agent git-agent-merge git-agent-diff; do
            lipo -create \
              "target/x86_64-apple-darwin/release/$executable" \
              "target/aarch64-apple-darwin/release/$executable" \
              -output "dist/universal-bin/$executable"
          done

      - name: Build release binaries
        if: runner.os == 'Windows'
        shell: cmd
        run: cargo build --release --locked

      - name: Stage pinned bundled plugins
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/prepare-bundled-plugins.py --target x86_64-pc-windows-msvc --output target/release/bundled-plugins
          elif [ "${{ runner.os }}" = "Linux" ]; then
            python3 scripts/prepare-bundled-plugins.py --target x86_64-unknown-linux-gnu --output target/release/bundled-plugins
          else
            python3 scripts/prepare-bundled-plugins.py --target x86_64-apple-darwin --output dist/universal-bin/bundled-plugins
            python3 scripts/prepare-bundled-plugins.py --target aarch64-apple-darwin --output dist/universal-bin/bundled-plugins
          fi

      - name: Package installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bash installer/linux/package-deb.sh \
            "${{ github.ref_name }}" \
            "$(dpkg --print-architecture)" \
            target/release \
            dist

      - name: Package installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash installer/macos/package.sh \
            "${{ github.ref_name }}" \
            dist/universal-bin \
            dist

      - name: Package installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --yes --no-progress

          $sourceDir = (Resolve-Path "target/release").Path
          $outputDir = (New-Item -ItemType Directory -Force -Path "dist").FullName
          $version = "${{ github.ref_name }}"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"

          & $iscc `
            "installer/windows/git-agent.iss" `
            "/DAppVersion=$version" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir"

      - name: Upload installer package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ matrix.asset-path }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download installer packages
        uses: actions/download-artifact@v7
        with:
          pattern: git-agent-*-installer
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # SemVer prerelease suffixes precede optional build metadata.
          version="${TAG_NAME#v}"
          version="${version%%+*}"
          release_flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${release_flags[@]}"
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              "${release_flags[@]}" \
              --verify-tag \
              --title "Git Agent $TAG_NAME" \
              --notes "[English changelog](https://github.com/adoin/git-Agent/blob/$TAG_NAME/CHANGELOG.md) · [中文更新日志](https://github.com/adoin/git-Agent/blob/$TAG_NAME/CHANGELOG.zh-CN.md)"
          fi

  cleanup:
    name: Keep recent build history
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete older build workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: build.yml
          KEEP_RUNS: "3"
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          run_ids=$(gh api "/repos/$REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')

          index=0
          for run_id in $run_ids; do
            index=$((index + 1))
            if [ "$index" -le "$KEEP_RUNS" ]; then
              continue
            fi

            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              continue
            fi

            gh api --method DELETE "/repos/$REPOSITORY/actions/runs/$run_id"
          done
