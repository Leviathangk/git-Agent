name: Website and plugin catalog

on:
  push:
    branches: [main]
    paths: ['README*.md', 'CHANGELOG*.md', 'website/**', '.github/workflows/website.yml', 'scripts/*cleanup-workflow-runs.py']
  pull_request:
    paths: ['README*.md', 'CHANGELOG*.md', 'website/**', '.github/workflows/website.yml', 'scripts/*cleanup-workflow-runs.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test workflow retention
        run: python3 scripts/test-cleanup-workflow-runs.py
      - name: Generate lists and changelog
        run: |
          python website/build_plugins.py
          python website/build_changelog.py
      - name: Validate website
        run: |
          python website/build_plugins.py --check
          python website/build_changelog.py --check
          python website/check.py
          node --check website/public/app.js
          node --check website/public/changelog.js
      - uses: actions/upload-artifact@v6
        with:
          name: git-agent-website
          path: website/public/
          if-no-files-found: error

  cleanup:
    name: Keep recent website history
    runs-on: ubuntu-latest
    needs: check
    if: always() && github.event_name != 'pull_request'
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Test workflow retention
        run: python3 scripts/test-cleanup-workflow-runs.py
      - name: Delete older website workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/cleanup-workflow-runs.py \
            --repository "$REPOSITORY" --workflow website.yml --keep 3 \
            --current-run-id "$CURRENT_RUN_ID" --delete
